<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Poppins:wght@500;600&display=block" rel="stylesheet">
<style>
  @font-face { font-family: ArchivoIt; font-style: italic; font-weight: 100 900; font-stretch: 62% 125%; src: url(archivo-italic.woff2) format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #f3f7ec; font-family: Poppins, sans-serif;
        background: linear-gradient(125deg, #0b3d24 0%, #0b3d24 50%, #0e4a66 100%); }
  .leaf { position: absolute; border-radius: 40px 8px; }
  .leaf--a { width: 460px; height: 460px; right: -170px; top: -230px; background: #167a36; opacity: .35; transform: rotate(18deg); }
  .leaf--b { width: 220px; height: 220px; left: -110px; bottom: -130px; background: #b9dd4a; opacity: .16; transform: rotate(-12deg); }
  .text { position: absolute; left: 64px; top: 56px; width: 600px; }
  .brand { width: 230px; display: block; }
  h1 { margin: 28px 0 0; font: italic 800 66px/0.95 ArchivoIt, sans-serif; font-stretch: 112%; letter-spacing: -0.02em; text-transform: uppercase; }
  h1 em { font-style: inherit; color: #b9dd4a; }
  .date { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; padding: 10px 20px; border-radius: 999px; background: #ffd43b; color: #0f2a1b; font: 600 22px/1.2 Poppins, sans-serif; }
  .date i { width: 10px; height: 10px; border-radius: 50%; background: #0f2a1b; }
  .sub { margin-top: 18px; font: 500 21px/1.4 Poppins, sans-serif; color: #b8cfb9; }
  .photo { position: absolute; right: 56px; top: 56px; width: 410px; height: 518px; object-fit: cover; object-position: 50% 30%; border-radius: 48px 10px; box-shadow: 0 24px 50px rgba(0,0,0,.35); }
  .logos { position: absolute; left: 64px; bottom: 44px; display: flex; align-items: center; gap: 26px; padding: 12px 22px; background: #f3f7ec; border-radius: 28px 8px; }
  .logos img { width: auto; display: block; }
  .logos .brand-pc { height: 52px; }
  .logos .sep { width: 1px; height: 40px; background: rgba(15, 42, 27, .18); }
  .logos .dan { height: 28px; }
  .logos .ptpn { height: 40px; }
</style></head>
<body><div class="og">
  <div class="leaf leaf--a"></div><div class="leaf leaf--b"></div>
  <div class="text">
    <img class="brand" src="../../public/img/logo-greenstride-white.png" alt="">
    <h1>Kumpulkan <em>300 km</em> bersama timmu</h1>
    <div class="date"><i></i>23 November – 20 Desember 2026</div>
  </div>
  <img class="photo" src="../../public/img/hero-runners.webp" alt="">
  <div class="logos">
    <img class="brand-pc" src="../../public/img/logo-planters-club-horizontal.png" alt="">
    <i class="sep"></i>
    <img class="dan" src="../../public/img/logo-danantara.png" alt="">
    <img class="ptpn" src="../../public/img/logo-ptpn-holding.png" alt="">
  </div>
</div></body></html>
